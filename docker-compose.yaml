version: '3.8'

services:
  image-processor:
    build: .
    container_name: image-processor
    restart: unless-stopped
    volumes:
      - ./data/input:/data/input
      - ./data/output:/data/output
      - ./config:/app/config
    environment:
      - INPUT_DIR=/data/input
      - OUTPUT_DIR=/data/output
      - CONFIG_FILE=/app/config/settings.yaml
      - SLEEP_INTERVAL=5
