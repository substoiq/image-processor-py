[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "image-processor-py"
version = "0.1.0"
description = "Image processing tool that monitors directories for images and processes them"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["Pillow>=9.0.0", "PyYAML>=6.0", "pillow-heif>=0.10.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.setuptools]
packages = ["image_processor"]
